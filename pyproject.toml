[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-simulacion"
version = "0.1.0"
description = "Herramientas reproducibles para analizar manos de póker de cinco cartas."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
